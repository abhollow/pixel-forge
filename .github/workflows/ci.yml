name: package-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tool dependencies
        run: python -m pip install pillow numpy scipy
      - name: Package consistency
        run: python tools/check_package.py
      - name: Python tool tests
        run: python -I tests/run_tests.py
      - name: Build the claude.ai skill zip
        run: python tools/build_skill_zip.py
